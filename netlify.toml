[build]
  command = "npm --prefix functions ci && npm run build"
  publish = "docs"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "sharp"
  ]
  directory = "functions/"

[[edge_functions]]
  path = "/*"
  function = "metadata"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/render/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/js/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"